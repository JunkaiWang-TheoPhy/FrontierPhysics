name: website

# Scoped to the website so unrelated task and doc changes do not pay for a
# Node build. Deployment is handled by the host's own Git integration; this
# workflow only proves the committed tree builds.
#
# PR runs use pull_request_target so the workflow definition and runner
# routing come from the default branch (see ci.yml); the built tree is still
# the PR merge result, checked out explicitly below.
on:
  pull_request_target:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"

permissions:
  contents: read

jobs:
  build:
    # npm ci and next build execute PR-controlled lifecycle scripts and config,
    # so this is untrusted-code execution: route it to the sandbox runner, not
    # the trusted host. See ci.yml.
    runs-on: ${{ vars.CI_MODE == 'github' && 'ubuntu-latest' || 'sandbox' }}
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out the code under test (for PRs, the merge result — unavailable until merge conflicts are resolved)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          # No npm cache: this job runs PR-controlled install scripts on a
          # persistent self-hosted runner, so a shared cache in the runner
          # user's home is a cross-PR poisoning surface. Install cold instead.
      - name: Install from the lockfile
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Confirm the example task rendered
        # The site shows exactly one example task, vendored under
        # public/example-task/. A silent regression here would ship a homepage
        # without it rather than failing the build, so assert the id declared
        # in src/lib/example-task.ts made it into the HTML.
        run: |
          task=$(grep -oP 'id: "\K[^"]+' src/lib/example-task.ts)
          if [ -z "$task" ]; then
            echo "::error::could not read the example task id from src/lib/example-task.ts"
            exit 1
          fi
          if ! grep -rq "$task" .next/server/app/index.html; then
            echo "::error::example task '$task' is missing from the rendered page"
            exit 1
          fi
          echo "Example task '$task' rendered."
