name: ci

# PR runs use pull_request_target so the workflow definition (and therefore
# runner routing) always comes from the default branch, never from a stale PR
# branch. The code under test is still the PR merge result, checked out
# explicitly below. The token is scoped read-only and checkout credentials are
# not persisted because these jobs execute code from the PR tree.

on:
  pull_request_target:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-tasks:
    # PR-controlled Python is executed below. Keep it off the persistent
    # self-hosted runner and use an isolated, disposable worker.
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code under test (for PRs, the merge result — unavailable until merge conflicts are resolved)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
          persist-credentials: false
          # The merge ref is intentionally executed only on the disposable
          # runner above with a read-only, non-persisted token.
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install hash-pinned PyYAML (task.md frontmatter parsing)
        run: >-
          python3 -m pip install --disable-pip-version-check
          --only-binary=:all: --require-hashes
          -r .github/agent-review/requirements.txt
      - name: Validate task structure
        run: |
          python3 .github/scripts/validate_repository.py
          python3 .github/scripts/validate_tasks.py tasks
      - name: Validate skill frontmatter
        run: python3 .github/scripts/lint_skill_frontmatter.py
      - name: Test skill frontmatter linter
        run: python3 .github/scripts/test_lint_skill_frontmatter.py
      - name: Test PR description checker
        run: python3 .github/scripts/test_check_pr_description.py
      - name: Test GPTZero AI-authorship checker
        run: python3 .github/scripts/test_check_ai_authorship.py
      - name: Test agent-review comment validator
        run: python3 .github/scripts/test_validate_agent_review_comment.py
      - name: Test PR data-tree containment validator
        run: python3 .github/scripts/test_validate_pr_data_tree.py
      - name: Validate FrontierPhysics documentation
        run: python3 .github/scripts/lint_frontierphysics_docs.py

  # Lints only the Python files this PR changed, so the repo's pre-existing
  # ruff debt does not block merges — it gets paid down as files are touched.
  # Scoped this way the check is safe to promote to a required merge-queue
  # gate (see the main-merge-queue ruleset).
  lint:
    # Ruff imports/reads PR-controlled paths; isolate fork input from the
    # persistent self-hosted host for the same reason as validate-tasks.
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code under test (for PRs, the merge result — unavailable until merge conflicts are resolved)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Ruff (changed Python files)
        run: |
          case "${{ github.event_name }}" in
            merge_group)  base="${{ github.event.merge_group.base_sha }}" ;;
            pull_request|pull_request_target) base="${{ github.event.pull_request.base.sha }}" ;;
            *)            base="$(git rev-parse HEAD~1)" ;;  # push: best-effort (last commit)
          esac
          # NUL-delimited so paths with spaces survive. Pure renames are skipped:
          # the task.md cutover moves many existing verifier files and should not
          # turn historical task-style debt into a repo-lint blocker. Vendored
          # website snapshots are display copies that must stay byte-identical
          # to their source task package, so they are not linted either.
          git diff -z --name-only --diff-filter=ACM "${base}...HEAD" -- \
            '*.py' \
            ':!tasks/**/bem_fastlap/**' \
            ':!website/public/example-task/**' \
            > "$RUNNER_TEMP/changed_py.z"
          echo "Changed Python files:"
          tr '\0' '\n' < "$RUNNER_TEMP/changed_py.z" | sed 's/^/  /'
          # xargs -r skips ruff entirely when no Python files changed.
          xargs -0 -r uvx ruff@0.14.10 check < "$RUNNER_TEMP/changed_py.z"
