name: Lint taxonomy

# PR runs use pull_request_target so the workflow definition and runner
# routing come from the default branch (see ci.yml); the linted tree is
# still the PR merge result, checked out explicitly below.

on:
  pull_request_target:
    paths:
      - "tasks/**/task.md"
      - "taxonomy.yaml"
      - ".github/scripts/lint_taxonomy.py"
      - ".github/workflows/lint-taxonomy.yml"
  push:
    branches: [main]
    paths:
      - "tasks/**/task.md"
      - "taxonomy.yaml"
      - ".github/scripts/lint_taxonomy.py"

permissions:
  contents: read

jobs:
  lint:
    # Executes the PR's own copy of lint_taxonomy.py against the checked-out
    # merge result, so this is untrusted-code execution: route it to the
    # sandbox runner, not the trusted host. See ci.yml.
    runs-on: ${{ vars.CI_MODE == 'github' && 'ubuntu-latest' || 'sandbox' }}
    steps:
      - name: Check out the code under test (for PRs, the merge result — unavailable until merge conflicts are resolved)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install hash-pinned PyYAML (task.md frontmatter parsing)
        run: >-
          python3 -m pip install --disable-pip-version-check
          --only-binary=:all: --require-hashes
          -r .github/agent-review/requirements.txt
      - name: Validate every task's taxonomy metadata (task.md frontmatter)
        run: python3 .github/scripts/lint_taxonomy.py
