name: Lint taxonomy

# PR runs use pull_request_target so the workflow definition and runner
# routing come from the default branch (see ci.yml); the linted tree is
# still the PR merge result, checked out explicitly below.

on:
  pull_request_target:
    paths:
      - "tasks/**/task.md"
      - "taxonomy.yaml"
      - ".github/scripts/lint_taxonomy.py"
      - ".github/workflows/lint-taxonomy.yml"
  push:
    branches: [main]
    paths:
      - "tasks/**/task.md"
      - "taxonomy.yaml"
      - ".github/scripts/lint_taxonomy.py"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ${{ vars.CI_RUNNER }}
    steps:
      - name: Check out the code under test (for PRs, the merge result — unavailable until merge conflicts are resolved)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML (task.md frontmatter parsing)
        run: python3 -m pip install pyyaml
      - name: Validate every task's taxonomy metadata (task.md frontmatter)
        run: python3 .github/scripts/lint_taxonomy.py
